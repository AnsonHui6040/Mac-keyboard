schema:
  schema_id: zhuyin
  name: 注音
  version: "1"
engine:
  processors:
    - ascii_composer
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - abc_segmentor
    - fallback_segmentor
  translators:
    - script_translator
speller:
  alphabet: "1qaz2wsxedcrfv5tgbyhnujm8ik,9ol.0p;/-6347"
  delimiter: " '"
  algebra:
    - "derive/[6347]$//"
    - "abbrev/^([1qaz2wsxedcrfv5tgbyhn]).+$/$1/"
translator:
  dictionary: zhuyin
  enable_user_dict: false
  enable_completion: false
  preedit_format:
    - "xlit|1qaz2wsxedcrfv5tgbyhnujm8ik,9ol.0p;/-6347|ㄅㄆㄇㄈㄉㄊㄋㄌㄍㄎㄏㄐㄑㄒㄓㄔㄕㄖㄗㄘㄙㄧㄨㄩㄚㄛㄜㄝㄞㄟㄠㄡㄢㄣㄤㄥㄦˊˇˋ˙|"
