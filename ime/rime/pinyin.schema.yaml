schema:
  schema_id: pinyin
  name: 拼音
  version: "1"
engine:
  processors:
    - ascii_composer
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - abc_segmentor
    - fallback_segmentor
  translators:
    - script_translator
speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
  delimiter: " '"
  algebra:
    - "derive/^([nl])ue$/$1ve/"
    - "abbrev/^([a-z]).+$/$1/"
    - "abbrev/^([zcs]h).+$/$1/"
translator:
  dictionary: pinyin
  enable_user_dict: false
  enable_completion: false
