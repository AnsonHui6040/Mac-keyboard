schema:
  schema_id: jyutping
  name: 粵拼
  version: "1"
engine:
  processors:
    - ascii_composer
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - abc_segmentor
    - fallback_segmentor
  translators:
    - script_translator
speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
  delimiter: " '"
  algebra:
    - "abbrev/^([a-z]).+$/$1/"
    - "abbrev/^(gw|kw|ng).+$/$1/"
translator:
  dictionary: jyutping
  enable_user_dict: false
  enable_completion: false
