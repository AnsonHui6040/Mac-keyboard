name: RemoteKeyboard
options:
  bundleIdPrefix: com.ansonhui
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "4YN34HPX6F"
packages:
  RemoteKeyboardCore:
    path: Packages/RemoteKeyboardCore
targets:
  RemoteKeyboardApp:
    type: application
    platform: iOS
    sources: [iOS/RemoteKeyboardApp]
    dependencies:
      - target: RemoteKeyboardExtension
        embed: true
      - package: RemoteKeyboardCore
    entitlements:
      path: iOS/RemoteKeyboardApp/RemoteKeyboardApp.entitlements
      properties:
        com.apple.security.application-groups: [group.com.ansonhui.remotekeyboard]
    info:
      path: iOS/RemoteKeyboardApp/Info.plist
      properties:
        CFBundleDisplayName: Remote Keyboard
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        NSBluetoothAlwaysUsageDescription: Remote Keyboard 需要藍牙，才能讓你的 Mac 連線並接收鍵盤送出的文字。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ansonhui.remotekeyboard
        TARGETED_DEVICE_FAMILY: "1"
  RemoteKeyboardExtension:
    type: app-extension
    platform: iOS
    sources:
      - iOS/RemoteKeyboardExtension
    dependencies:
      - package: RemoteKeyboardCore
    entitlements:
      path: iOS/RemoteKeyboardExtension/RemoteKeyboardExtension.entitlements
      properties:
        com.apple.security.application-groups: [group.com.ansonhui.remotekeyboard]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ansonhui.remotekeyboard.keyboard
        INFOPLIST_FILE: iOS/RemoteKeyboardExtension/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  MacReceiver:
    type: application
    platform: macOS
    sources: [macOS/MacReceiver]
    dependencies:
      - package: RemoteKeyboardCore
    info:
      path: macOS/MacReceiver/Info.plist
      properties:
        CFBundleDisplayName: Remote Keyboard Receiver
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        NSBluetoothAlwaysUsageDescription: Remote Keyboard Receiver 需要藍牙，才能接收 iPhone 鍵盤送出的文字。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ansonhui.remotekeyboard.receiver
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
  MacReceiverTests:
    type: bundle.unit-test
    platform: macOS
    sources: [macOS/MacReceiverTests]
    dependencies:
      - target: MacReceiver
      - package: RemoteKeyboardCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ansonhui.remotekeyboard.receiver.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MacReceiver:
    build:
      targets:
        MacReceiver: all
    test:
      targets: [MacReceiverTests]
