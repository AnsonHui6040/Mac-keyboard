[package]
name = "rk-inject"
version = "0.1.0"
description = "Remote Keyboard receiver: the Injector trait and its test doubles; platform injectors live beside it"
edition.workspace = true
publish.workspace = true

[dependencies]
thiserror = "2.0.21"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "=0.13.13", default-features = false, features = ["tokio", "remote_desktop", "screencast", "clipboard"] }
futures-util = "0.3"
rustix = { version = "1", default-features = false, features = ["std", "fs"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
