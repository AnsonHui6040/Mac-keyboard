[package]
name = "rk-ble"
version = "0.1.0"
description = "Remote Keyboard receiver: the BLE link (scan, connect, subscribe, write) behind one event/command interface"
edition.workspace = true
publish.workspace = true

[dependencies]
rk-core = { path = "../rk-core" }
sha2 = "0.11.1"
uuid = "1.29.2"

[target.'cfg(windows)'.dependencies]
tokio = { version = "1.54.1", features = ["sync"] }
windows = { version = "=0.61.3", features = [
  "Devices_Bluetooth",
  "Devices_Bluetooth_Advertisement",
  "Devices_Bluetooth_GenericAttributeProfile",
  "Foundation",
  "Foundation_Collections",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_System_WinRT",
] }
