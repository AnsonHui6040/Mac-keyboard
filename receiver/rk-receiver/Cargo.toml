[package]
name = "rk-receiver"
version = "0.2.0-alpha.1"
description = "Remote Keyboard receiver for Windows and Linux: tray shell around the platform-independent application"
edition.workspace = true
publish.workspace = true
build = "build.rs"

[lib]
name = "rk_receiver"
path = "src/lib.rs"

[[bin]]
name = "rk-receiver"
path = "src/main.rs"

[[bin]]
name = "rk-diag"
path = "src/bin/rk-diag.rs"

[dependencies]
rk-core = { path = "../rk-core" }
rk-ble = { path = "../rk-ble" }
rk-inject = { path = "../rk-inject" }
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync", "time", "rt", "macros"] }
uuid = "1.29.2"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"
base64 = "0.23.1"

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.26.1", default-features = false }
windows = { version = "=0.61.3", features = [
  "Devices_Bluetooth",
  "Foundation",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Credentials",
  "Win32_System_Console",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",
  "Win32_System_WinRT",
  "Win32_Globalization",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.3.7"
secret-service = { version = "5.2.0", features = ["rt-tokio-crypto-rust"] }
tokio = { version = "1.54.1", features = ["process", "signal", "io-util"] }

[package.metadata.deb]
name = "remote-keyboard"
maintainer = "Remote Keyboard <noreply@users.noreply.github.com>"
section = "utils"
revision = ""
changelog = "../../packaging/linux/changelog"
priority = "optional"
extended-description = "Receives keystrokes from the Remote Keyboard iPhone app over Bluetooth Low Energy and types them on this computer."
depends = "$auto, zenity, xdg-desktop-portal, xdg-desktop-portal-gnome, gnome-keyring, bluez"
assets = [
  ["target/release/rk-receiver", "usr/bin/", "755"],
  ["target/release/rk-diag", "usr/bin/", "755"],
  ["../../packaging/linux/remote-keyboard.desktop", "usr/share/applications/", "644"],
  ["../../packaging/linux/remote-keyboard.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
]
